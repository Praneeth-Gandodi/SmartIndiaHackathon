# nginx config for the AGNI DRISHTI static bundle.
#
# This is a single-page app: unknown paths fall back to index.html so a
# refresh on any route still loads the app.

server {
    listen 80;
    # Also accept IPv6, so clients that resolve localhost to ::1 connect.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The globe textures and logo are large and never change between deploys.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Hashed build assets are immutable, so cache them hard.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients keep booting an old bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Leaflet tiles come from the Esri endpoint at runtime, so the demo needs
    # outbound network access. Nothing here proxies them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
